name: Deploy to Azure

# Fires on every push to main, which includes pull-request merges.
# Also runnable by hand from Actions -> Deploy to Azure -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Two pushes in quick succession must not deploy over each other. Queue instead of
# cancelling: a cancelled deploy can leave an app half-updated.
concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which app actually changed. The web deploy is by far the slowest step, because Azure
  # runs npm install and next build on the App Service instance itself - redeploying it for
  # a backend-only change costs many minutes and risks nothing but downtime.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare against the previous commit on main
        id: filter
        run: |
          before="${{ github.event.before }}"
          # No usable baseline - a manual run, the first push, or a force push. Deploy both
          # rather than guess and silently skip an app that needed updating.
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "$before" ] \
             || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "no baseline commit - deploying both"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          api=false
          web=false
          # The workflow itself touches how both are deployed, so treat it as affecting both.
          if echo "$changed" | grep -qE '^(backend/|\.github/workflows/)'; then api=true; fi
          if echo "$changed" | grep -qE '^(frontend/|\.github/workflows/)'; then web=true; fi

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "-> deploy api=$api  web=$web"

  # Cheap gate so a commit that cannot even build never reaches Azure. Azure itself
  # builds the app (Oryx, via SCM_DO_BUILD_DURING_DEPLOYMENT), and a failure there
  # surfaces as a running-but-broken site rather than a failed deploy.
  verify:
    name: Verify build
    needs: changes
    runs-on: ubuntu-latest
    # The work here is ~2 minutes. Without a bound a wedged step would hold the concurrency
    # group for GitHub's 6 hour default, blocking every later merge behind it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Guards against the failure that took the site down on 2026-08-06: a shell script
      # committed with CRLF makes the Linux container exit 2 on every start, and Azure
      # blocks the site after repeated cold-start failures. .gitattributes pins these to
      # LF; this proves it held rather than trusting that it did.
      - name: Startup scripts must have Unix line endings
        run: |
          bad=0
          for f in backend/startup.sh frontend/startup.sh; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::$f has CRLF line endings. Azure runs it in a Linux container, where that fails with 'cd: \$'.\\r': No such file or directory' and exit code 2."
              bad=1
            else
              echo "  OK  $f"
            fi
          done
          exit $bad

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.api == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: needs.changes.outputs.api == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the API (catches syntax errors and missing dependencies)
        if: needs.changes.outputs.api == 'true'
        working-directory: backend
        run: python -c "import app.main; print('app.main imported OK')"

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        if: needs.changes.outputs.web == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        if: needs.changes.outputs.web == 'true'
        working-directory: frontend
        run: npm run build

  deploy-api:
    name: Deploy API
    needs: [changes, verify]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Upload is quick; Azure then runs pip install via Oryx before the app answers.
    timeout-minutes: 25
    environment:
      name: production-api
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      # azure/webapps-deploy reports both a missing secret and a profile with no MSDeploy
      # entry as the same opaque "does not contain kudu URL". Check first and say which.
      # Only the length and yes/no answers are printed - never the profile itself.
      - name: Check publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_API_PUBLISH_PROFILE is empty or does not exist. Add it under Settings > Secrets and variables > Actions. The name must match exactly."
            exit 1
          fi
          echo "secret is present, ${#PROFILE} characters"
          if ! printf '%s' "$PROFILE" | grep -q 'publishMethod="MSDeploy"'; then
            echo "::error::The publish profile has no MSDeploy entry, so there is no kudu URL to deploy to. Enabling SCM basic auth does not repair an already-downloaded file: re-download the publish profile from the Web App Overview page AFTER enabling it, then replace this secret with the new file's full contents."
            exit 1
          fi
          echo "MSDeploy entry found - profile looks usable"

      # Only backend/ is shipped. Azure runs `bash startup.sh` from the zip root, so
      # the zip root must be the backend directory, not the repository root.
      - name: Deploy backend to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: edgeinvesting-email-contacts-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: backend

      - name: Health check
        run: |
          url="https://edgeinvesting-email-contacts-api-ftbnfqhnbjg9dkfn.canadacentral-01.azurewebsites.net/api/v1/health"
          # App Service can take a while to come back up after a restart.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "API healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-no response}, retrying in 10s"
            sleep 10
          done
          echo "::error::API did not return 200 from /api/v1/health within 5 minutes"
          exit 1

  deploy-web:
    name: Deploy Web
    needs: [changes, verify]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # The long pole in the whole pipeline: Oryx runs npm install and next build on the B1
    # instance itself, which takes far longer than the same build on a runner.
    timeout-minutes: 40
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_WEB_PUBLISH_PROFILE is empty or does not exist. Add it under Settings > Secrets and variables > Actions. The name must match exactly."
            exit 1
          fi
          echo "secret is present, ${#PROFILE} characters"
          if ! printf '%s' "$PROFILE" | grep -q 'publishMethod="MSDeploy"'; then
            echo "::error::The publish profile has no MSDeploy entry, so there is no kudu URL to deploy to. Enabling SCM basic auth does not repair an already-downloaded file: re-download the publish profile from the Web App Overview page AFTER enabling it, then replace this secret with the new file's full contents."
            exit 1
          fi
          echo "MSDeploy entry found - profile looks usable"

      # node_modules and .next are gitignored, so Oryx installs and builds on the
      # server. NEXT_PUBLIC_API_BASE is inlined at build time, which means it must be
      # set as an app setting on the WEB app for that server-side build to see it.
      - name: Deploy frontend to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: edgeinvesting-email-contacts-web
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          package: frontend

      # A successful upload says nothing about whether the site starts. A container that
      # crash-loops leaves the deploy green and the site returning 503 - which is exactly
      # what happened on 2026-08-06 and was only noticed by polling the URL by hand.
      - name: Health check
        run: |
          url="https://edgeinvesting-email-contacts-web-ewdra7hjg9e0dff5.canadacentral-01.azurewebsites.net/compass"
          # Oryx runs npm install and next build on the instance, so first response is slow.
          for attempt in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "web app healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-no response}, retrying in 15s"
            sleep 15
          done
          echo "::error::Web app did not return 200 within 10 minutes. Check LogFiles/StartupLogs in Kudu - a container that exits during startup is usually a bad startup.sh or a failed build."
          exit 1
