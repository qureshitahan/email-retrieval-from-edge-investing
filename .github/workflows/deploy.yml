name: Deploy to Azure

# Fires on every push to main, which includes pull-request merges.
# Also runnable by hand from Actions -> Deploy to Azure -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Two pushes in quick succession must not deploy over each other. Queue instead of
# cancelling: a cancelled deploy can leave an app half-updated.
concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap gate so a commit that cannot even build never reaches Azure. Azure itself
  # builds the app (Oryx, via SCM_DO_BUILD_DURING_DEPLOYMENT), and a failure there
  # surfaces as a running-but-broken site rather than a failed deploy.
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    # The work here is ~2 minutes. Without a bound a wedged step would hold the concurrency
    # group for GitHub's 6 hour default, blocking every later merge behind it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import the API (catches syntax errors and missing dependencies)
        working-directory: backend
        run: python -c "import app.main; print('app.main imported OK')"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy-api:
    name: Deploy API
    needs: verify
    runs-on: ubuntu-latest
    # Upload is quick; Azure then runs pip install via Oryx before the app answers.
    timeout-minutes: 25
    environment:
      name: production-api
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      # azure/webapps-deploy reports both a missing secret and a profile with no MSDeploy
      # entry as the same opaque "does not contain kudu URL". Check first and say which.
      # Only the length and yes/no answers are printed - never the profile itself.
      - name: Check publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_API_PUBLISH_PROFILE is empty or does not exist. Add it under Settings > Secrets and variables > Actions. The name must match exactly."
            exit 1
          fi
          echo "secret is present, ${#PROFILE} characters"
          if ! printf '%s' "$PROFILE" | grep -q 'publishMethod="MSDeploy"'; then
            echo "::error::The publish profile has no MSDeploy entry, so there is no kudu URL to deploy to. Enabling SCM basic auth does not repair an already-downloaded file: re-download the publish profile from the Web App Overview page AFTER enabling it, then replace this secret with the new file's full contents."
            exit 1
          fi
          echo "MSDeploy entry found - profile looks usable"

      # Only backend/ is shipped. Azure runs `bash startup.sh` from the zip root, so
      # the zip root must be the backend directory, not the repository root.
      - name: Deploy backend to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: edgeinvesting-email-contacts-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: backend

      - name: Health check
        run: |
          url="https://edgeinvesting-email-contacts-api-ftbnfqhnbjg9dkfn.canadacentral-01.azurewebsites.net/api/v1/health"
          # App Service can take a while to come back up after a restart.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "API healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-no response}, retrying in 10s"
            sleep 10
          done
          echo "::error::API did not return 200 from /api/v1/health within 5 minutes"
          exit 1

  deploy-web:
    name: Deploy Web
    needs: verify
    runs-on: ubuntu-latest
    # The long pole in the whole pipeline: Oryx runs npm install and next build on the B1
    # instance itself, which takes far longer than the same build on a runner.
    timeout-minutes: 40
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_WEB_PUBLISH_PROFILE is empty or does not exist. Add it under Settings > Secrets and variables > Actions. The name must match exactly."
            exit 1
          fi
          echo "secret is present, ${#PROFILE} characters"
          if ! printf '%s' "$PROFILE" | grep -q 'publishMethod="MSDeploy"'; then
            echo "::error::The publish profile has no MSDeploy entry, so there is no kudu URL to deploy to. Enabling SCM basic auth does not repair an already-downloaded file: re-download the publish profile from the Web App Overview page AFTER enabling it, then replace this secret with the new file's full contents."
            exit 1
          fi
          echo "MSDeploy entry found - profile looks usable"

      # node_modules and .next are gitignored, so Oryx installs and builds on the
      # server. NEXT_PUBLIC_API_BASE is inlined at build time, which means it must be
      # set as an app setting on the WEB app for that server-side build to see it.
      - name: Deploy frontend to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: edgeinvesting-email-contacts-web
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          package: frontend
